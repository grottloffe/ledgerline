name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The engine claims to be cross-platform and dependency-free on Node >= 22.
    # This matrix is what makes that claim checkable rather than aspirational.
    # 20 is kept as a courtesy leg: it is below the supported floor, so a
    # failure there is information, not a release blocker.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No cache: the plugin has no dependencies and no lockfile, so
          # there is nothing to restore and no install step to speed up.

      # Deliberately no `npm ci` — adding one would fail for want of a lockfile.
      - name: Run tiers 0-2
        run: npm test

      # Tier 3 is agent-driven and cannot run here; see tests/tier3/README.md.

  # One stable check name that summarises the whole matrix. Nothing requires it
  # yet -- it exists so that turning on "require status checks" is a one-switch
  # change that does not have to name every matrix leg. Requiring the legs
  # directly would be brittle: changing the matrix orphans a required check,
  # and a required check that never runs blocks merges forever.
  gate:
    needs: test
    # Without always(), this job is skipped when the matrix fails, and a skipped
    # check reports as neutral rather than failing -- which would defeat it.
    if: always()
    runs-on: ubuntu-latest
    name: gate
    steps:
      - name: Every matrix leg must have succeeded
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
